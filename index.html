<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positivus</title>

    <!-- BOOTSTRAP -->
    <link rel="stylesheet" href="scss/bootstrap.css">

    <!-- STYLE CSS -->
    <link rel="stylesheet" href="scss/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">

</head>

<body>

    <header class="header">
        <div class="my-container">
            <div class="d-flex justify-content-between align-items-center header__parent">
                <img src="img/header-bg.svg" alt="">

                <nav class="header__navbar">
                    <ul class="header__list d-flex gap-5 grotesk-400 ">
                        <li>About us</li>
                        <li>Services</li>
                        <li>Use Cases</li>
                        <li>Pricing</li>
                        <li>Blog</li>
                    </ul>


                </nav>
                <button class="header__btn btn btn-outline-dark grotesk-400">Request a quote</button>
            </div>
        </div>

    </header>

    <main class="main">
        <div class="my-container">
            <section class="hero">
                <div class="hero__parent d-flex justify-content-center align-items-center gap-5">
                    <div class="">
                        <h1 class="grotesk-500 hero__title ">Navigating the <br> digital landscape <br> for success</h1>

                        <p class="hero__info grotesk-500  mt-4 mb-5">
                            Our digital marketing agency helps businesses grow and succeed online through a range of
                            services including SEO, PPC, social media marketing, and content creation.
                        </p>

                        <button class="hero__book btn btn-outline-dark grotesk-400 ">Book a consultation</button>
                    </div>
                    <img src="img/hero-bg.svg" alt="" class="hero__img">
                </div>
            </section>

            <section class="companies">
                <div class="my-container">
                    <div class="">
                        <ul class="companies__list d-flex justify-content-between align-items-center gap-5 mt-5">
                            <img src="img/amazon.svg" alt="">
                            <img src="img/dribble.svg" alt="">
                            <img src="img/hubsbot.svg" alt="">
                            <img src="img/notion.svg" alt="">
                            <img src="img/netflix.svg" alt="">
                            <img src="img/zoom.svg" alt="">
                        </ul>
                    </div>
                </div>
            </section>
        </div>
    </main>


    <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
